[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cicada-research"
version = "0.1.0"
description = "Local-first Cicada 3301 / Liber Primus research system"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cicada = "cicada.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
